spring.application.name=Backend


spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=Savory
spring.datasource.password=Savory
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
#preventing the creation of the duplicate tables with HTE_
spring.jpa.properties.org.hibernate.envers.auto=none




#Salt Rounds For Encryption passwords
encryption.salt.rounds=10


#JWT
jwt.algorithm-key=SuperSafeKey
jwt.issuer=Admin
jwt.expiryInSeconds=3600

#EmailConfigs

email.from=no-reply@savorybite.com

#General Configs
app.frontend.url=http://localhost:3000


#SMTP Configs
spring.mail.host=localhost
spring.mail.port=1025
