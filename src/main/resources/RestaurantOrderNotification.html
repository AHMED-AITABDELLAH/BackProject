<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant WebSocket Orders Test</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f8fa; padding: 2rem; }
        h2 { color: #222; }
        label { margin-top: 1em; display: block; }
        input, button, textarea { margin: 0.25em 0; padding: 0.4em; }
        input, textarea { width: 320px; }
        #messages { background: #fff; border: 1px solid #bbb; height: 220px; overflow-y: auto; margin-top: 1em; width: 640px; }
        #connection-controls, #sending-controls { margin-bottom: 1.2em; }
        .status-c { color: green; }
        .status-d { color: red; }
        button { min-width: 100px; }
        tr td { font-family: monospace; }
    </style>
</head>
<body>
<h2>Test Restaurant Order WebSocket</h2>
<div id="connection-controls">
    <label for="websocketURL">WebSocket URL:
        <input id="websocketURL" value="http://localhost:8080/websocket"/>
    </label>
    <label for="websocketTopic">STOMP Topic:
        <input id="websocketTopic" value="/topic/restaurant/1/orders"/>
    </label>
    <label for="websocketToken">JWT Token:
        <textarea id="websocketToken" placeholder="Paste JWT token here"></textarea>
    </label>
    <button id="connect">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <span id="status" class="status-d">Disconnected</span>
</div>

<div id="sending-controls">
    <label for="message">Send message (JSON):
        <input id="message" placeholder="{ &quot;sample&quot;: &quot;value&quot; }" />
    </label>
    <button id="send" disabled>Send</button>
</div>

<table id="messages"></table>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    var stompClient = null;

    function setConnected(connected) {
        document.getElementById("connect").disabled = connected;
        document.getElementById("disconnect").disabled = !connected;
        document.getElementById("send").disabled = !connected;
        var statusEl = document.getElementById("status");
        statusEl.textContent = connected ? "Connected" : "Disconnected";
        statusEl.className = connected ? "status-c" : "status-d";
        if (connected) {
            document.getElementById("messages").innerHTML = "";
        }
    }

    function connect() {
        var socket = new SockJS(document.getElementById("websocketURL").value);
        stompClient = Stomp.over(socket);

        var headers = {};
        var tokenVal = document.getElementById("websocketToken").value.trim();
        if (tokenVal) {
            headers["Authorization"] = "Bearer " + tokenVal;
        }

        stompClient.connect(headers, function (frame) {
            setConnected(true);
            console.log('Connected: ' + frame);
            var subscribeHeaders = {};
            if (tokenVal) {
                subscribeHeaders["Authorization"] = "Bearer " + tokenVal;
            }
            var topic = document.getElementById("websocketTopic").value;
            showMessage("[System] Subscribed to: " + topic);
            stompClient.subscribe(topic, function (message) {
                console.log(message)
                showMessage("[ in ] " + message.body);
            }, subscribeHeaders);
        }, function (err) {
            console.log(err)
            showMessage("[ err ] " + err)
            setConnected(false);
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        setConnected(false);
        console.log("Disconnected");
    }

    function sendMessage() {
        var tokenVal = document.getElementById("websocketToken").value.trim();
        var headers = {};
        if (tokenVal) {
            headers["Authorization"] = "Bearer " + tokenVal;
        }
        stompClient.send(document.getElementById("websocketTopic").value, headers,
            JSON.stringify(document.getElementById("message").value));
        showMessage("[ out ] " + document.getElementById("message").value);
    }

    function showMessage(message) {
        var messages = document.getElementById("messages");
        var row = messages.insertRow();
        var cell = row.insertCell(0);
        cell.textContent = message;
    }

    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("connect").onclick = connect;
        document.getElementById("disconnect").onclick = disconnect;
        document.getElementById("send").onclick = sendMessage;
    });
</script>
</body>
</html>
